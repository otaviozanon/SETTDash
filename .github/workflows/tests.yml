name: Tests

# Pull requests and non-main branches. main is covered by release.yml, which runs this same suite as
# a gate before it versions, tags or publishes anything.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run test suite
        shell: pwsh
        run: |
          .\tests\Run-All.ps1
          if ($LASTEXITCODE -ne 0) { throw "Test suite failed (exit $LASTEXITCODE)" }

      - name: Upload smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: |
            tests/.tools/smoke-marker.txt
            tests/.tools/smoke-stdout.txt
            tests/.tools/smoke-stderr.txt
            tests/.tools/SETTDash.smoke.ps1
            tests/.tools/sandbox-native.txt
            tests/.tools/sandbox-runtime/**
          if-no-files-found: ignore
          retention-days: 7
