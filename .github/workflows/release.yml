name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version and tag
        id: ver
        shell: pwsh
        run: |
          $skip = $false
          $version = $null
          $tag = $null
          $event = $env:GITHUB_EVENT_NAME

          function Set-BumpVersion {
            git fetch --tags
            $last = git tag --sort=-v:refname | Where-Object { $_ -match '^v[0-9]+\.[0-9]+\.[0-9]+$' } | Select-Object -First 1
            if (-not $last) {
              $script:version = '3.2.1'
            } else {
              $base = $last.TrimStart('v')
              $p = $base.Split('.')
              $script:version = "$($p[0]).$($p[1]).$([int]$p[2] + 1)"
            }
            $script:tag = "v$script:version"
            git config user.name github-actions
            git config user.email github-actions@github.com
            if (-not (git tag -l $script:tag)) {
              git tag $script:tag
              git push origin $script:tag
              Write-Host "Tagged $script:tag"
            } else {
              Write-Host "Tag $script:tag already exists"
            }
          }

          if ($event -eq 'workflow_dispatch') {
            # Manual run: always build. Reuse the tag at HEAD, otherwise bump.
            git fetch --tags
            $headTag = git tag --points-at HEAD | Where-Object { $_ -match '^v[0-9]+\.[0-9]+\.[0-9]+$' } | Select-Object -First 1
            if ($headTag) {
              $tag = $headTag
              $version = $tag.TrimStart('v')
            } else {
              Set-BumpVersion
            }
          }
          elseif ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            $version = $tag.TrimStart('v')
          }
          elseif ($env:GITHUB_REF_TYPE -eq 'branch') {
            $changed = git diff --name-only HEAD~1 HEAD 2>$null
            if ($changed -match '^(Core/|Main/|Sidebar/|Build\.ps1|SETTDash\.ico|icon_lightning\.ico)') {
              Set-BumpVersion
            } else {
              Write-Host "No source change, skipping build"
              $skip = $true
            }
          }
          else {
            $skip = $true
          }

          Write-Output "skip=$skip" >> $env:GITHUB_OUTPUT
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "skip=$skip version=$version tag=$tag"

      - name: Install ps2exe
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          # Install ps2exe straight from its GitHub repo (pinned commit) instead of the
          # PowerShell Gallery: the Gallery had a global outage (package API 404) that
          # broke both Install-Module and Install-PSResource build paths.
          $sha = '05c62615b33864c177f5de8e56e06e4c7f34adbb'
          $zip = Join-Path $env:TEMP 'PS2EXE.zip'
          Invoke-WebRequest -Uri "https://codeload.github.com/MScholtes/PS2EXE/zip/$sha" -OutFile $zip -UserAgent 'SETTDash-builder'
          $tmpDest = Join-Path $env:TEMP 'PS2EXE_extract'
          if (Test-Path $tmpDest) { Remove-Item $tmpDest -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $tmpDest -Force
          $src = Get-ChildItem $tmpDest -Recurse -Filter 'ps2exe.psm1' | Select-Object -First 1 -ExpandProperty DirectoryName
          $moduleRoot = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'PowerShell\Modules\ps2exe'
          if (Test-Path $moduleRoot) { Remove-Item $moduleRoot -Recurse -Force }
          New-Item -Path $moduleRoot -ItemType Directory -Force | Out-Null
          Copy-Item -Path (Join-Path $src '*') -Destination $moduleRoot -Recurse -Force
          Import-Module ps2exe
          if (-not (Get-Command Invoke-ps2exe -ErrorAction Stop)) { throw "ps2exe module failed to load" }
          Write-Host "ps2exe module installed from MScholtes/PS2EXE@$sha"

      - name: Inject version into dashboard sources
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"

          (Get-Content 'Main\Layout.ps1' -Raw) -replace 'Dashboard v[0-9]+\.[0-9]+(\.[0-9]+)?', "Dashboard v$version" |
            Set-Content 'Main\Layout.ps1' -NoNewline

          (Get-Content 'Main\Startup.ps1' -Raw) -replace 'Dashboard v[0-9]+\.[0-9]+(\.[0-9]+)?', "Dashboard v$version" |
            Set-Content 'Main\Startup.ps1' -NoNewline

          (Get-Content 'Main\Window.ps1' -Raw) `
            -replace 'SETTDash v[0-9]+\.[0-9]+(\.[0-9]+)?', "SETTDash v$version" `
            -replace '\$Script:AppVersion = "[0-9]+\.[0-9]+\.[0-9]+"', "`$Script:AppVersion = `"$version`"" |
            Set-Content 'Main\Window.ps1' -NoNewline

          Write-Host "Injected version $version into dashboard sources"

      - name: Concatenate modular sources
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          .\Build.ps1
          if (-not (Test-Path SETTDash.ps1)) { throw "Build.ps1 failed: SETTDash.ps1 not found" }

      - name: Build exe
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          Import-Module ps2exe
          Invoke-ps2exe -inputFile SETTDash.ps1 -outputFile SETTDash.exe -iconFile SETTDash.ico -noConsole -requireAdmin -x86 -title "SETTDash" -description "All-in-one Windows optimization & tweaking dashboard" -product "SETTDash" -company "otaviozanon" -version "${{ steps.ver.outputs.version }}"
          if (-not (Test-Path SETTDash.exe)) { throw "Build failed: SETTDash.exe not found" }

      - name: Upload artifact
        if: steps.ver.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SETTDash
          path: SETTDash.exe

      - name: Create release
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          if (-not $tag) { Write-Host "No tag, skipping release"; exit 0 }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists, skipping"
          } else {
            gh release create $tag SETTDash.exe --title "SETTDash $tag" --generate-notes
          }
